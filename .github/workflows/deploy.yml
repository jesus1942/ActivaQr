name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix server

      - name: Verificar secret VITE_API_URL
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secret VITE_API_URL está VACÍO. Cargalo en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "VITE_API_URL definido: ${#VITE_API_URL} caracteres"

      - name: Calidad y pruebas
        run: |
          npm run lint
          npm test
          npm run build --prefix server

      # Arma el sitio completo: landing indexable en la raíz + app en /app/.
      - name: Build del sitio
        run: npm run build:site
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verificar el sitio publicado
        run: |
          if ! grep -rq "api.activaqr.net" dist/app/assets/; then
            echo "::error::El build NO contiene api.activaqr.net — el secret VITE_API_URL tiene otro valor."
            exit 1
          fi
          if ! grep -rq "Autorizar con eWeLink" dist/app/assets/; then
            echo "::error::El build no contiene el flujo OAuth vigente de eWeLink."
            exit 1
          fi
          if grep -rq "Guardar de forma segura" dist/app/assets/; then
            echo "::error::El build conserva el formulario anterior de Access Token manual."
            exit 1
          fi
          if ! grep -q "id=\"planes\"" dist/index.html; then
            echo "::error::La raíz del sitio no es la landing: no se encontró la sección de planes."
            exit 1
          fi
          if ! grep -q "indexOf('#/')" dist/index.html; then
            echo "::error::Falta el rescate de los QR viejos en la landing."
            exit 1
          fi
          echo "OK: landing en la raíz, app en /app/, QR viejos redirigidos."

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a Pages
        uses: actions/deploy-pages@v4
        id: deployment
