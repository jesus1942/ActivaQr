<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ActivaQR</title>
  <script>
    // GitHub Pages SPA redirect: la app usa HashRouter, así que alcanza con
    // volver a la base conservando el hash. En github.io la base es el nombre
    // del repo; con dominio propio es la raíz.
    var l = window.location;
    var base = l.hostname.endsWith('github.io') ? '/' + l.pathname.split('/')[1] + '/' : '/';
    l.replace(l.protocol + '//' + l.host + base + l.hash);
  </script>
</head>
</html>
