  <body>
    <div id="root">
      <!-- Contenido para quien llega sin JavaScript (incluidos buscadores).
           React lo reemplaza al montar la app. -->
      <noscript>
        <h1>ActivaQR — Gestión de activos industriales con QR</h1>
        <p>
          Pegás un código QR en la máquina. Cualquiera con un celular lo escanea
          y ve la ficha del equipo al instante: qué es, dónde está, cómo viene
          funcionando y a quién llamar. Sin instalar nada, sin contraseña.
        </p>
        <p>
          El personal registrado carga mediciones desde el celular —aunque no
          haya señal—, registra mantenimientos y recibe alertas cuando un valor
          se va de rango. Planes desde USD 29 por mes, con 30 días gratis.
        </p>
        <p>Esta aplicación necesita JavaScript. Activalo para ingresar.</p>
